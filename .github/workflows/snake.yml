name: Generate contribution familiar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: WhiteRabbit-glitch
          outputs: |
            dist/github-snake.svg?color_snake=%23EBD747&color_dots=%23080517,%2354193A,%23B52A5C,%23D887A7,%23F5EDF8
            dist/github-snake-dark.svg?color_snake=%23EBD747&color_dots=%23080517,%2354193A,%23B52A5C,%23D887A7,%23F5EDF8

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
