name: Generate contribution familiar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: WhiteRabbit-glitch
          outputs: |
            dist/github-snake.svg?color_snake=%23AE4C3C&color_dots=%23494841,%23677369,%235A6662,%23F17E54,%23AE4C3C
            dist/github-snake-dark.svg?color_snake=%23F17E54&color_dots=%23494841,%23677369,%235A6662,%23AE4C3C,%23F17E54

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
